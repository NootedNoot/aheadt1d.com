<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glucose Report — Ahead</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1d0339" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232ee59d' d='M12 3s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" />
  <script src="api-config.js"></script>
  <style>
/* Ahead's own look (Northern Lights) on screen; a light, ink-friendly
   version for print. Glucose-range colors are validated CVD-safe sets, one
   for each surface (dark screen / white paper), and every range is always
   named in text - never color alone. Event types carry an emoji + label;
   only correction direction is colored (matching the high/low ranges). */
:root {
  --bg: #1d0339;
  --surface: rgba(255, 255, 255, 0.055);
  --surface2: rgba(255, 255, 255, 0.09);
  --line: rgba(255, 255, 255, 0.13);
  --ink: #f1f3ff;
  --mute: #c9bbe8;
  --dim: #a08fc9;
  --mint: #2ee59d;
  --violet: #9d65ff;
  --sky: #c49bff;
  --vlow: #c4359a;
  --low: #dc7050;
  --inr: #2a9fd4;
  --high: #b88c1a;
  --vhigh: #c04a10;
  --band: rgba(42, 159, 212, 0.12);
  --iqr: rgba(42, 159, 212, 0.42);
  --p90: rgba(42, 159, 212, 0.16);
  --median: #e8f6ff;
  --trace: #f1f3ff;
  --marker: #c49bff;
  --chip: rgba(255, 255, 255, 0.08);
  --f-head: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font: 14.5px/1.55 var(--f-body);
  background: var(--bg) radial-gradient(120% 70% at 50% -10%, #4e148c 0%, var(--bg) 60%) fixed;
}
a { color: var(--mint); }
.toolbar { position: sticky; top: 0; z-index: 10; background: rgba(18, 1, 36, 0.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.toolbar .in { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font: 700 16px var(--f-head); color: #fff; text-decoration: none; margin-right: auto; }
.brand svg { width: 18px; height: 18px; fill: var(--mint); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; color: var(--mute); font: 700 12.5px var(--f-body); padding: 6px 12px; cursor: pointer; }
.seg button.on { background: var(--mint); color: #03210f; }
.tb-btn { background: linear-gradient(120deg, var(--mint), var(--sky)); color: #03210f; border: 0; border-radius: 999px; font: 800 12.5px var(--f-body); padding: 8px 15px; cursor: pointer; }
.tb-check { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--mute); cursor: pointer; }
.doc { max-width: 1040px; margin: 20px auto 70px; padding: 0 16px; }
.page { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 26px 28px; margin-bottom: 20px; }
@media (max-width: 640px) { .page { padding: 18px 14px; border-radius: 16px; } }
.kicker { font: 700 11px var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--mint); margin-bottom: 4px; }
h1 { font: 700 26px/1.15 var(--f-head); margin: 0; letter-spacing: -0.02em; }
h2 { font: 700 20px/1.2 var(--f-head); margin: 0 0 4px; letter-spacing: -0.01em; }
h3 { font: 700 14px var(--f-head); margin: 18px 0 8px; color: var(--ink); }
.sub { color: var(--mute); font-size: 13px; margin: 0 0 14px; }
.muted { color: var(--mute); }
.dim { color: var(--dim); }
.small { font-size: 12px; }
.mono { font-family: var(--f-mono); }
.hdr { display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
.who { display: grid; grid-template-columns: auto auto; gap: 2px 14px; margin: 0; font-size: 13px; }
.who dt { color: var(--dim); }
.who dd { margin: 0; font-weight: 700; }
.tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0 6px; }
@media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.tile .k { font: 700 10.5px var(--f-mono); color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
.tile .v { font: 700 26px/1.15 var(--f-mono); margin-top: 2px; }
.tile .v small { font-size: 13px; color: var(--mute); font-weight: 600; }
.tile .g { font-size: 11.5px; color: var(--mute); }
.goalflag { font: 700 10px var(--f-body); padding: 1px 7px; border-radius: 999px; margin-left: 4px; white-space: nowrap; }
.goalflag.ok { background: rgba(46, 229, 157, 0.16); color: var(--mint); }
.goalflag.no { background: rgba(255, 122, 184, 0.16); color: #ff9fca; }
.tirwrap { margin-top: 18px; }
.tirbar { display: flex; height: 26px; gap: 2px; border-radius: 8px; overflow: hidden; }
.tirbar div { min-width: 3px; }
.tirlegend { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
@media (max-width: 760px) { .tirlegend { grid-template-columns: 1fr 1fr; } }
.tirlegend .it { font-size: 12.5px; }
.tirlegend b { font: 700 15px var(--f-mono); display: block; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font: 10px var(--f-body); fill: var(--dim); }
.agpwrap { position: relative; margin-top: 6px; }
.tip { position: absolute; pointer-events: none; background: #0e0120; border: 1px solid var(--line); color: var(--ink); font-size: 12px; padding: 7px 10px; border-radius: 10px; white-space: nowrap; transform: translate(-50%, -112%); display: none; z-index: 5; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--mute); margin-top: 8px; }
.legend i { display: inline-block; width: 18px; height: 8px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
details summary { cursor: pointer; font-size: 12px; color: var(--mute); margin-top: 10px; }
table.list { width: 100%; border-collapse: collapse; font-size: 13px; }
table.list th { text-align: left; font: 700 10.5px var(--f-mono); color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--line); padding: 7px 8px; }
table.list td { border-bottom: 1px solid rgba(255, 255, 255, 0.07); padding: 8px; vertical-align: top; }
table.list td.n { font-family: var(--f-mono); white-space: nowrap; }
table.list tr { break-inside: avoid; }
@media screen and (max-width: 760px) { table.list { display: block; overflow-x: auto; } .who { grid-template-columns: auto 1fr; } }
.insights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 860px) { .insights { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .insights { grid-template-columns: 1fr; } }
.ins { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; break-inside: avoid; }
.ins .ic { font-size: 18px; }
.ins .k { font: 700 10.5px var(--f-mono); color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
.ins .v { font: 700 22px var(--f-mono); margin: 2px 0; }
.ins p { margin: 0; font-size: 12.5px; color: var(--mute); }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 700 11.5px var(--f-body); padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--ink); white-space: nowrap; border: 1px solid transparent; }
.chip.dir-high { border-color: var(--high); color: var(--ink); background: rgba(184, 140, 26, 0.18); }
.chip.dir-low { border-color: var(--low); color: var(--ink); background: rgba(220, 112, 80, 0.18); }
.chip.parsed { font-family: var(--f-mono); font-weight: 600; background: rgba(46, 229, 157, 0.12); color: var(--mint); }
.chip.flag { background: rgba(255, 122, 184, 0.14); color: #ffb3d6; }
.chip.good { background: rgba(46, 229, 157, 0.12); color: var(--mint); }
.slices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 860px) { .slices { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .slices { grid-template-columns: 1fr; } }
.slice { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; break-inside: avoid; }
.slice .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.slice .hd b { font: 700 15px var(--f-head); }
.slice .cnt { font: 700 13px var(--f-mono); color: var(--dim); }
.slice ul { list-style: none; margin: 8px 0 0; padding: 0; font-size: 12.5px; }
.slice li { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-top: 1px dashed rgba(255, 255, 255, 0.08); }
.slice li span:last-child { font-family: var(--f-mono); font-weight: 700; color: var(--ink); white-space: nowrap; }
.slice li span:first-child { color: var(--mute); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.filters button { background: var(--surface); border: 1px solid var(--line); color: var(--mute); border-radius: 999px; font: 700 12px var(--f-body); padding: 5px 11px; cursor: pointer; }
.filters button.on { background: rgba(46, 229, 157, 0.14); border-color: var(--mint); color: var(--mint); }
.moments { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .moments { grid-template-columns: 1fr; } }
.moment { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 10px; break-inside: avoid; }
.moment .when { font: 600 12px var(--f-mono); color: var(--dim); }
.moment .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.moment blockquote { margin: 6px 0 8px; padding: 6px 10px; border-left: 3px solid var(--sky); background: rgba(196, 155, 255, 0.07); border-radius: 0 8px 8px 0; font-size: 13px; }
.moment .out { font-size: 12.5px; color: var(--mute); margin-top: 6px; }
.moment .out b { color: var(--ink); font-family: var(--f-mono); }
.moment .stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
body.hide-notes .note-text { display: none; }
body.hide-notes .note-hidden { display: block; }
.note-hidden { display: none; color: var(--dim); font-style: italic; font-size: 12px; margin: 4px 0; }
.days { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 14px; }
@media (max-width: 760px) { .days { grid-template-columns: 1fr; } }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px 5px; break-inside: avoid; }
.day .dh { display: flex; justify-content: space-between; font-size: 12px; gap: 8px; }
.day .dh b { font: 700 13px var(--f-head); }
.empty { padding: 16px; text-align: center; color: var(--mute); border: 1px dashed var(--line); border-radius: 14px; }
.foot { font-size: 11px; color: var(--dim); border-top: 1px solid var(--line); margin-top: 20px; padding-top: 10px; }
.state { max-width: 560px; margin: 80px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 28px; text-align: center; }
.delta-up { color: #f2c35a; }
.delta-down { color: #6fc6ef; }

/* ── Print: white paper, same layout, light-validated range colors ── */
@media print {
  @page { size: letter; margin: 11mm; }
  :root {
    --bg: #fff; --surface: #fff; --surface2: #f6f4fb; --line: #dcd6ea; --ink: #1a1030; --mute: #4a4160; --dim: #6d6488;
    --mint: #0b7a5c; --sky: #6b3fd1; --marker: #6b3fd1; --chip: #f1edf9;
    --vlow: #a52a50; --low: #e2586e; --inr: #0d84c2; --high: #c98f12; --vhigh: #a35a10;
    --band: rgba(13, 132, 194, 0.08); --iqr: rgba(13, 132, 194, 0.32); --p90: rgba(13, 132, 194, 0.12);
    --median: #0a3d62; --trace: #1d2433;
  }
  body { background: #fff; font-size: 10.5px; }
  .toolbar, .no-print, details, .filters, .tip { display: none !important; }
  .doc { margin: 0; padding: 0; max-width: none; }
  .page { border: 0; border-radius: 0; padding: 0; margin: 0; break-after: page; }
  .page:last-child { break-after: auto; }
  .tile, .ins, .slice, .moment, .day { border-color: #dcd6ea; }
  .moment { display: block !important; }
  .goalflag.ok { background: #e3f4ec; color: #0b6b4d; }
  .goalflag.no { background: #fbe9ef; color: #8f1f3e; }
  .chip.parsed, .chip.good { background: #e3f4ec; color: #0b6b4d; }
  .chip.flag { background: #fbe9ef; color: #8f1f3e; }
  .moment blockquote { background: #f6f2fd; }
  .delta-up { color: #8a5a00; } .delta-down { color: #0a5f8f; }
  .kicker { color: #6b3fd1; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <div class="in">
      <a class="brand" href="portal.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z"/></svg>Ahead report</a>
      <div class="seg" role="group" aria-label="Report period">
        <button type="button" data-days="7">7d</button>
        <button type="button" data-days="14" class="on">14d</button>
        <button type="button" data-days="30">30d</button>
        <button type="button" data-days="90">90d</button>
      </div>
      <label class="tb-check"><input type="checkbox" id="showNotes" checked /> Show my notes</label>
      <button type="button" class="tb-btn" id="printBtn">Print / Save PDF</button>
    </div>
  </div>

  <main class="doc" id="doc">
    <div class="state">Loading your report…</div>
  </main>

  <script>
  (function () {
    'use strict';

    // ── Config / API (same rules as the other account pages) ──
    var isDev = location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    var API = window.AHEAD_API_BASE || 'https://api.aheadt1d.com';
    if (isDev) { try { API = localStorage.getItem('ahead_api_url') || 'http://localhost:3000'; } catch (_) {} }
    var token = null;
    try { token = localStorage.getItem('ahead_token'); } catch (_) {}
    var params = new URLSearchParams(location.search);
    var ownerParam = params.get('ownerId');
    var days = [7, 14, 30, 90].indexOf(parseInt(params.get('days'), 10)) >= 0 ? parseInt(params.get('days'), 10) : 14;

    var DAY = 86400000, HOUR = 3600000, MIN = 60000;
    var RANGES = [
      { key: 'vlow', label: 'Very low', range: '<54', color: 'var(--vlow)', test: function (v) { return v < 54; }, goal: '< 1%', ok: function (p) { return p.vlow < 1; } },
      { key: 'low', label: 'Low', range: '54–69', color: 'var(--low)', test: function (v) { return v >= 54 && v < 70; }, goal: '< 4% incl. very low', ok: function (p) { return p.low + p.vlow < 4; } },
      { key: 'inr', label: 'In range', range: '70–180', color: 'var(--inr)', test: function (v) { return v >= 70 && v <= 180; }, goal: '> 70%', ok: function (p) { return p.inr > 70; } },
      { key: 'high', label: 'High', range: '181–250', color: 'var(--high)', test: function (v) { return v > 180 && v <= 250; }, goal: '< 25% incl. very high', ok: function (p) { return p.high + p.vhigh < 25; } },
      { key: 'vhigh', label: 'Very high', range: '>250', color: 'var(--vhigh)', test: function (v) { return v > 250; }, goal: '< 5%', ok: function (p) { return p.vhigh < 5; } }
    ];
    var KINDS = {
      hcorr: { glyph: '▲', label: 'High correction', dir: 'high' },
      ltreat: { glyph: '▼', label: 'Low treatment', dir: 'low' },
      corr: { glyph: '💉', label: 'Correction' },
      meal: { glyph: '🍽️', label: 'Meal / food' },
      insulin: { glyph: '💉', label: 'Insulin' },
      exercise: { glyph: '🏃', label: 'Exercise' },
      site_change: { glyph: '🩹', label: 'Site change' },
      pod_issue: { glyph: '🔧', label: 'Pod issue' },
      illness: { glyph: '🤒', label: 'Illness' },
      stress: { glyph: '😰', label: 'Stress' },
      other: { glyph: '📝', label: 'Note' }
    };
    var Y_MIN = 40, Y_MAX = 350;

    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function r1(x) { return Math.round(x * 10) / 10; }
    function fmtDate(ms, opts) { return new Date(ms).toLocaleDateString([], opts || { month: 'short', day: 'numeric', year: 'numeric' }); }
    function fmtDay(ms) { return fmtDate(ms, { weekday: 'short', month: 'short', day: 'numeric' }); }
    function fmtTime(ms) { return new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
    function fmtDur(min) {
      min = Math.round(min);
      if (min < 60) return min + 'm';
      var h = Math.floor(min / 60), m = min % 60;
      return h + 'h' + (m ? ' ' + m + 'm' : '');
    }
    function signed(d) { return (d > 0 ? '+' : '') + Math.round(d); }
    function median(arr) { if (!arr.length) return null; var s = arr.slice().sort(function (a, b) { return a - b; }); return percentile(s, 0.5); }
    function startOfLocalDay(ms) { var d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); }
    function minuteOfDay(ms) { var d = new Date(ms); return d.getHours() * 60 + d.getMinutes(); }

    function api(path) {
      return fetch(API + path, { headers: { Authorization: 'Bearer ' + token } }).then(function (r) {
        if (r.status === 401) throw Object.assign(new Error('signin'), { code: 401 });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
    }

    // ── Core math (consensus definitions; matches Ahead's AgpMetricsCalculator) ──
    function percentile(sorted, q) {
      if (!sorted.length) return null;
      var pos = (sorted.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
      return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
    }
    function computeStats(v, spanMs) {
      var n = v.length;
      if (!n) return null;
      var sum = 0, i; for (i = 0; i < n; i++) sum += v[i];
      var mean = sum / n, ss = 0;
      for (i = 0; i < n; i++) ss += (v[i] - mean) * (v[i] - mean);
      var sd = Math.sqrt(ss / n);
      var pct = {}; RANGES.forEach(function (r) { pct[r.key] = 0; });
      for (i = 0; i < n; i++) for (var k = 0; k < RANGES.length; k++) if (RANGES[k].test(v[i])) { pct[RANGES[k].key]++; break; }
      RANGES.forEach(function (r) { pct[r.key] = pct[r.key] * 100 / n; });
      return {
        n: n, mean: mean, sd: sd, cv: mean ? sd / mean * 100 : 0, gmi: 3.31 + 0.02392 * mean, pct: pct,
        active: spanMs ? Math.min(100, n / Math.max(1, spanMs / (5 * MIN)) * 100) : null,
        min: Math.min.apply(null, v), max: Math.max.apply(null, v)
      };
    }
    function computeAgp(t, v) {
      var BINS = 96, bins = [], b, i;
      for (b = 0; b < BINS; b++) bins.push([]);
      for (i = 0; i < t.length; i++) bins[Math.floor(minuteOfDay(t[i]) / 15) % BINS].push(v[i]);
      var keys = ['p5', 'p25', 'p50', 'p75', 'p95'], qs = [0.05, 0.25, 0.5, 0.75, 0.95];
      var raw = bins.map(function (arr) {
        if (arr.length < 3) return null;
        var s = arr.slice().sort(function (a, c) { return a - c; }), o = { n: s.length };
        keys.forEach(function (k, j) { o[k] = percentile(s, qs[j]); });
        return o;
      });
      // ±30 min circular smoothing, as consensus AGP reports do.
      return raw.map(function (pt, idx) {
        if (!pt) return null;
        var acc = { n: pt.n }, w = 0;
        keys.forEach(function (k) { acc[k] = 0; });
        for (var d = -2; d <= 2; d++) {
          var q = raw[(idx + d + BINS) % BINS];
          if (!q) continue;
          keys.forEach(function (k) { acc[k] += q[k]; });
          w++;
        }
        keys.forEach(function (k) { acc[k] /= w; });
        return acc;
      });
    }
    // Runs of readings matching `test` lasting >= minMinutes; a run ends after
    // 15 min out of the condition or at a data gap > 20 min.
    function episodes(t, v, test, minMinutes) {
      var out = [], cur = null, outSince = null;
      function close() {

            '<td>' + (ep.treated ? '✓ yes' : '<span class="dim">none logged</span>') + '</td></tr>';
        }).join('') + '</table>' : '<div class="empty">No lows of 15+ minutes in this period. 🎉</div>';
      var page2 = '<section class="page"><div class="kicker">Pulled from your glucose</div><h2>What your numbers say</h2>' +
        '<p class="sub">Observations computed from the CGM data alone, to talk through with your care team. Not advice.</p>' +
        '<div class="insights">' + ins + '</div>' +
        '<h3>By part of the day</h3>' + blockTable +
        '<h3>Every low <span class="dim small" style="font-weight:500">(15+ minutes under 70)</span></h3>' + lowTable + footer() + '</section>';

      // Page 3: moments (logged events), sliced by type
      var page3;
      if (!state.own) {
        page3 = '<section class="page"><div class="kicker">Logged moments</div><h2>What happened after</h2><div class="empty">Logged events and notes are private to the account owner and aren\'t part of a shared report.</div>' + footer() + '</section>';
      } else if (!events.length) {
        page3 = '<section class="page"><div class="kicker">Logged moments</div><h2>What happened after</h2><div class="empty">No events logged in this period. Corrections, low treatments, meals, exercise and notes you log in Ahead show up here with what your glucose did next.</div>' + footer() + '</section>';
      } else {
        events.forEach(function (e) { e.an = analyzeEvent(e, e.cls, all.t, all.v, events); });
        page3 = '<section class="page"><div class="kicker">Logged moments</div><h2>What happened after</h2>' +
          '<p class="sub">Each thing you logged, split by type, with what your glucose did in the hours after. Doses and carbs shown are read from your own notes.</p>' +
          '<div class="slices">' + buildSlices(events) + '</div>' +
          '<div class="filters no-print" id="momentFilters">' + buildFilters(events) + '</div>' +
          '<div class="moments" id="moments">' + events.slice().reverse().map(function (e) { return momentCard(e, all.t, all.v); }).join('') + '</div>' +
          footer() + '</section>';
      }

      // Page 4: daily profiles
      var dayStarts = [], lastDay = startOfLocalDay(to);
      for (var d = 0; d < Math.min(days, 14); d++) { var ds = new Date(lastDay); ds.setDate(ds.getDate() - d); dayStarts.push(ds.getTime()); }
      var dayCards = dayStarts.map(function (ds) {
        var sl = slice(t, v, ds, ds + DAY - 1), dsS = computeStats(sl.v);
        var lowCount = episodes(sl.t, sl.v, function (x) { return x < 70; }, 15).length;
        return '<div class="day"><div class="dh"><b>' + esc(fmtDay(ds)) + '</b>' +
          '<span class="muted">' + (dsS ? Math.round(dsS.pct.inr) + '% in range · avg ' + Math.round(dsS.mean) + (lowCount ? ' · ' + lowCount + ' low' + (lowCount > 1 ? 's' : '') : '') : 'no data') + '</span></div>' +
          daySvg(t, v, ds, state.own ? events : []) + '</div>';
      }).join('');
      var page4 = '<section class="page"><div class="kicker">Day by day</div><h2>Daily traces</h2><p class="sub">' +
        (days > 14 ? 'The most recent 14 days. ' : '') + 'Band = 70–180. Colored dots = readings out of range. Dashed lines = things you logged (hover for details).</p>' +
        '<div class="days">' + dayCards + '</div>' + footer() + '</section>';

      $('doc').innerHTML = page1 + page2 + page3 + page4;
      wireAgpHover(agp);
      wireFilters();
    }

    function buildInsights(t, v, from, to, lows) {
      var cards = [];
      function card(ic, k, val, text) { cards.push('<div class="ins"><div class="ic">' + ic + '</div><div class="k">' + k + '</div><div class="v">' + val + '</div><p>' + text + '</p></div>'); }
      // Dawn rise: 3 AM vs 7 AM on each day with both readings.
      var rises = [];
      for (var day = startOfLocalDay(from); day < to; day += DAY) {
        var d0 = new Date(day); d0.setHours(3, 0, 0, 0); var d1 = new Date(day); d1.setHours(7, 0, 0, 0);
        var a = nearest(t, v, d0.getTime(), 10), b = nearest(t, v, d1.getTime(), 10);
        if (a != null && b != null) rises.push(b - a);
      }
      if (rises.length >= 3) {
        var mr = median(rises);
        card('🌅', 'Early-morning change', signed(mr) + ' <small class="dim">mg/dL</small>', 'Typical change from 3 AM to 7 AM across ' + rises.length + ' mornings' + (mr >= 20 ? ', a steady pre-wake rise (often called the dawn effect).' : '.'));
      }
      // Overnight: nights with a low.
      var nights = 0, lowNights = 0;
      for (day = startOfLocalDay(from); day < to; day += DAY) {
        var n = slice(t, v, day, day + 6 * HOUR);
        if (n.v.length < 36) continue;
        nights++;
        if (episodes(n.t, n.v, function (x) { return x < 70; }, 15).length) lowNights++;
      }
      if (nights) card('🌙', 'Nights with a low', lowNights + ' <small class="dim">of ' + nights + '</small>', 'Nights (12–6 AM) with at least one low lasting 15+ minutes.');
      // Fast drops: >= 2 mg/dL/min sustained for 15 min.
      var fast = 0, cooldownUntil = 0;
      for (var i = 3; i < t.length; i++) {
        if (t[i] < cooldownUntil) continue;
        var span = (t[i] - t[i - 3]) / MIN;
        if (span > 0 && span <= 20 && (v[i] - v[i - 3]) / span <= -2) { fast++; cooldownUntil = t[i] + HOUR; }
      }
      card('⏬', 'Fast drops', String(fast), 'Times glucose fell 2+ mg/dL every minute for 15 minutes (' + r1(fast / ((to - from) / DAY) * 7) + ' per week).');
      // Low recovery.
      var rec = lows.map(function (ep) { var up = firstTime(t, v, ep.end + 1, ep.end + 3 * HOUR, function (x) { return x >= 70; }); return up ? (up - ep.start) / MIN : null; }).filter(function (x) { return x != null; });
      if (rec.length) card('⏱️', 'Typical low length', fmtDur(median(rec)), 'Median time from dropping under 70 to being back above it, over ' + rec.length + ' lows.');
      // Highs.
      var highs = episodes(t, v, function (x) { return x > 180; }, 15);
      if (highs.length) card('⏫', 'Typical high length', fmtDur(median(highs.map(function (h) { return (h.end - h.start) / MIN + 5; }))), highs.length + ' stretches above 180; this is how long the middle one lasted.');
      // Longest streak in range.
      var best = 0, runStart = null;
      for (i = 0; i < t.length; i++) {
        var gap = i > 0 && t[i] - t[i - 1] > 20 * MIN;
        if (v[i] >= 70 && v[i] <= 180 && !gap) { if (runStart === null) runStart = t[i]; best = Math.max(best, t[i] - runStart); }
        else runStart = (v[i] >= 70 && v[i] <= 180) ? t[i] : null;
      }
      card('🏁', 'Longest in-range streak', fmtDur(best / MIN + 5), 'Longest unbroken stretch between 70 and 180.');
      // Best / toughest day.
      var dayStats = [];
      for (day = startOfLocalDay(from); day < to; day += DAY) {
        var ds = slice(t, v, day, day + DAY - 1);
        if (ds.v.length >= 144) dayStats.push({ day: day, s: computeStats(ds.v) });
      }
      if (dayStats.length >= 3) {
        dayStats.sort(function (a, b) { return b.s.pct.inr - a.s.pct.inr; });
        var top = dayStats[0], bottom = dayStats[dayStats.length - 1];
        card('⭐', 'Best day', Math.round(top.s.pct.inr) + '<small class="dim">%</small>', esc(fmtDay(top.day)) + ' had the most time in range. Toughest: ' + esc(fmtDay(bottom.day)) + ' at ' + Math.round(bottom.s.pct.inr) + '%.');
        var wk = [], we = [];
        dayStats.forEach(function (x) { var dow = new Date(x.day).getDay(); (dow === 0 || dow === 6 ? we : wk).push(x.s.pct.inr); });
        if (wk.length && we.length) card('📅', 'Weekdays vs weekends', Math.round(median(wk)) + '% <small class="dim">/ ' + Math.round(median(we)) + '%</small>', 'Typical time in range on weekdays vs weekends.');
      }
      return cards.join('');
    }

    function buildSlices(events) {
      var groups = {};
      events.forEach(function (e) { (groups[e.cls.kind] = groups[e.cls.kind] || []).push(e); });
      var order = ['hcorr', 'ltreat', 'corr', 'meal', 'insulin', 'exercise', 'site_change', 'pod_issue', 'illness', 'stress', 'other'];
      function med(list, f) { var vals = list.map(f).filter(function (x) { return x != null && !isNaN(x); }); return vals.length ? median(vals) : null; }
      function count(list, pred) { return list.filter(pred).length; }
      return order.filter(function (k) { return groups[k]; }).map(function (k) {
        var list = groups[k], rows = [];
        var hasFlag = function (re) { return function (e) { return e.an.flags.some(function (f) { return re.test(f); }); }; };
        if (k === 'hcorr' || k === 'insulin' || k === 'corr') {
          var d2 = med(list, function (e) { return e.an.g2 != null && e.an.at != null ? e.an.g2 - e.an.at : null; });
          if (d2 != null) rows.push(['Typical change at 2h', signed(d2)]);
          var bk = med(list, function (e) { return e.an.backMin != null ? e.an.backMin : null; });
          if (bk != null) rows.push(['Typical time to < 180', fmtDur(bk)]);
          rows.push(['Followed by a low (4h)', count(list, hasFlag(/^Went low/)) + ' of ' + list.length]);
          if (k !== 'insulin') rows.push(['Another dose within 2h', count(list, hasFlag(/^Another dose/)) + ' of ' + list.length]);
        } else if (k === 'ltreat') {
          rows.push(['Rebounded over 180', count(list, hasFlag(/^Rebounded/)) + ' of ' + list.length]);
          var pk = med(list, function (e) { var s = e.an.stats.filter(function (x) { return x[0] === 'Peak in 3h'; })[0]; return s ? s[1] : null; });
          if (pk != null) rows.push(['Typical peak after', Math.round(pk)]);
        } else if (k === 'meal') {
          var rise = med(list, function (e) { var s = e.an.stats.filter(function (x) { return x[0] === 'Rise to peak'; })[0]; return s ? +s[1] : null; });
          if (rise != null) rows.push(['Typical rise', signed(rise)]);
          rows.push(['Peaked over 250', count(list, hasFlag(/^Peaked over/)) + ' of ' + list.length]);
        } else if (k === 'exercise') {
          var d1 = med(list, function (e) { return e.an.g1 != null && e.an.at != null ? e.an.g1 - e.an.at : null; });
          if (d1 != null) rows.push(['Typical change in 1h', signed(d1)]);
          rows.push(['Low later (12h)', count(list, hasFlag(/^Low /)) + ' of ' + list.length]);
        } else {
          var af = med(list, function (e) { var s = e.an.stats.filter(function (x) { return /after$/.test(x[0]) && /^Avg/.test(x[0]); })[0]; return s ? s[1] : null; });
          if (af != null) rows.push(['Typical avg after', Math.round(af)]);
        }
        var kk = KINDS[k];
        return '<div class="slice"><div class="hd"><b>' + (kk.dir ? '<span class="chip dir-' + kk.dir + '">' + kk.glyph + ' ' + kk.label + '</span>' : kk.glyph + ' ' + kk.label) + '</b><span class="cnt">×' + list.length + '</span></div>' +
          '<ul>' + rows.map(function (r) { return '<li><span>' + r[0] + '</span><span>' + r[1] + '</span></li>'; }).join('') + '</ul></div>';
      }).join('');
    }

    function buildFilters(events) {
      var counts = {};
      events.forEach(function (e) { counts[e.cls.kind] = (counts[e.cls.kind] || 0) + 1; });
      return '<button type="button" data-k="all" class="on">All · ' + events.length + '</button>' + Object.keys(counts).map(function (k) {
        return '<button type="button" data-k="' + k + '">' + KINDS[k].glyph + ' ' + KINDS[k].label + ' · ' + counts[k] + '</button>';
      }).join('');
    }

    function momentCard(e, t, v) {
      var k = KINDS[e.cls.kind], an = e.an;
      var chips = '<span class="chip' + (k.dir ? ' dir-' + k.dir : '') + '">' + k.glyph + ' ' + k.label + '</span>';
      if (e.cls.dose) chips += '<span class="chip parsed" title="From your note">' + esc(e.cls.dose) + '</span>';
      if (e.cls.carbs) chips += '<span class="chip parsed" title="From your note">' + esc(e.cls.carbs) + '</span>';
      if (an.at != null) chips += '<span class="chip">at ' + an.at + '</span>';
      if (e.source === 'web') chips += '<span class="chip">logged on web</span>';
      var note = e.cls.typed ? '<blockquote class="note-text">' + esc(e.cls.typed) + '</blockquote><div class="note-hidden">Note hidden</div>' : '';
      var stats = an.stats.map(function (s) { return '<span class="chip">' + esc(s[0]) + ' <b class="mono">' + esc(s[1]) + '</b></span>'; }).join('') +
        an.good.map(function (s) { return '<span class="chip good">✓ ' + esc(s) + '</span>'; }).join('') +
        an.flags.map(function (s) { return '<span class="chip flag">! ' + esc(s) + '</span>'; }).join('');
      var deltas = (an.g1 != null || an.g2 != null) && an.at != null
        ? '<div class="out">+1h <b>' + (an.g1 != null ? an.g1 + ' <span class="' + (an.g1 > an.at ? 'delta-up' : 'delta-down') + '">(' + signed(an.g1 - an.at) + ')</span>' : '—') + '</b> · +2h <b>' + (an.g2 != null ? an.g2 + ' <span class="' + (an.g2 > an.at ? 'delta-up' : 'delta-down') + '">(' + signed(an.g2 - an.at) + ')</span>' : '—') + '</b>' + (an.sentence ? ' · ' + an.sentence : '') + '</div>'
        : '';
      return '<article class="moment" data-k="' + e.cls.kind + '"><div class="when">' + esc(fmtDay(e.time) + ' · ' + fmtTime(e.time)) + '</div>' +
        '<div class="chips">' + chips + '</div>' + note + sparkSvg(t, v, e) + deltas + (stats ? '<div class="stats">' + stats + '</div>' : '') + '</article>';
    }

    function wireFilters() {
      var box = $('momentFilters');
      if (!box) return;
      box.addEventListener('click', function (ev) {
        var b = ev.target.closest('button');
        if (!b) return;
        momentFilter = b.getAttribute('data-k');
        box.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
        document.querySelectorAll('.moment').forEach(function (m) { m.style.display = momentFilter === 'all' || m.getAttribute('data-k') === momentFilter ? '' : 'none'; });
      });
    }

    function footer() {
      return '<div class="foot">Made with Ahead (aheadt1d.com) from CGM data synced by the patient\'s phone. Ahead is beta software, not a medical device; data may have gaps or sensor error. Ranges and goals follow the International Consensus on Time in Range (2019). Doses/carbs are read from the patient\'s own notes. Not a substitute for clinical judgment.</div>';
    }

    function wireAgpHover(agp) {
      var hit = $('agpHit'), tip = $('agpTip'), cross = $('agpCross'), wrap = $('agpWrap');
      if (!hit) return;
      function show(ev) {
        var svg = hit.ownerSVGElement, rect = svg.getBoundingClientRect();
        var pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
        var loc = pt.matrixTransform(svg.getScreenCTM().inverse());
        var L = 36, w = 900 - 36 - 8;
        var bin = Math.max(0, Math.min(95, Math.floor((loc.x - L) / w * 96)));
        var a = agp[bin], xx = L + (bin + 0.5) / 96 * w;
        cross.setAttribute('x1', xx); cross.setAttribute('x2', xx); cross.setAttribute('opacity', '.35');
        var hh = Math.floor(bin / 4), mm = (bin % 4) * 15;
        var label = (hh % 12 || 12) + ':' + (mm < 10 ? '0' : '') + mm + (hh < 12 ? ' AM' : ' PM');
        tip.innerHTML = '<b>' + label + '</b><br>' + (a ? 'Median ' + Math.round(a.p50) + ' mg/dL<br>Middle 50%: ' + Math.round(a.p25) + '–' + Math.round(a.p75) + '<br>5–95%: ' + Math.round(a.p5) + '–' + Math.round(a.p95) : 'Not enough data');
        tip.style.display = 'block';
        tip.style.left = ((xx / 900) * rect.width) + 'px';
        tip.style.top = (ev.clientY - wrap.getBoundingClientRect().top) + 'px';
      }
      hit.addEventListener('mousemove', show);
      hit.addEventListener('touchstart', function (e) { show(e.touches[0]); }, { passive: true });
      hit.addEventListener('mouseleave', function () { tip.style.display = 'none'; cross.setAttribute('opacity', '0'); });
    }

    function fail(html) { $('doc').innerHTML = '<div class="state">' + html + '</div>'; }

    function load() {
      if (!token) { fail('Please <a href="login.html">sign in</a> to view your report.'); return; }
      var to = Date.now(), from = to - 90 * DAY;
      api('/api/auth/me').then(function (me) {
        var user = me.user || me;
        var owner = ownerParam || user.id;
        state.own = owner === user.id;
        state.profile = state.own ? user : null;
        state.ownerLabel = state.own ? (user.displayName || user.email) : '';
        var jobs = [api('/api/readings/range?from=' + from + '&to=' + to + (state.own ? '' : '&ownerId=' + encodeURIComponent(owner)))];
        jobs.push(state.own ? api('/api/events?from=' + from + '&to=' + to).catch(function () { return { events: [] }; }) : Promise.resolve({ events: [] }));
        if (!state.own) jobs.push(api('/api/shares/accessible').catch(function () { return []; }));
        return Promise.all(jobs).then(function (res) {
          state.readings = res[0];
          state.events = res[1].events || [];
          if (!state.own) {
            var list = Array.isArray(res[2]) ? res[2] : [];
            var hit = list.filter(function (s) { return s.ownerId === owner; })[0];
            state.ownerLabel = hit ? hit.ownerEmail : 'Shared stream';
          }
          render();
        });
      }).catch(function (e) {
        if (e && e.code === 401) fail('Your session has expired. Please <a href="login.html">sign in again</a>.');
        else fail('Couldn\'t load the report. The Ahead server may be offline, or may need a restart to pick up the report feature.<br><span class="small dim">' + esc(e && e.message) + '</span>');
      });
    }

    document.querySelectorAll('.seg button').forEach(function (b) {
      b.classList.toggle('on', +b.getAttribute('data-days') === days);
      b.addEventListener('click', function () {
        days = +b.getAttribute('data-days');
        document.querySelectorAll('.seg button').forEach(function (x) { x.classList.toggle('on', x === b); });
        var u = new URL(location.href); u.searchParams.set('days', days); history.replaceState(null, '', u);
        if (state.readings) render();
      });
    });
    $('showNotes').addEventListener('change', function () { document.body.classList.toggle('hide-notes', !this.checked); });
    $('printBtn').addEventListener('click', function () { window.print(); });

    load();
  })();
  </script>
</body>
</html>
