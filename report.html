<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glucose Report — Ahead</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232ee59d' d='M12 3s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" />
  <script src="api-config.js"></script>
  <style>
/* A clinical document: light, dense, prints on Letter/A4. Range colors are a
   validated CVD-safe set (deep red / coral / blue / amber / brown) and every
   range is always labeled in text, never color alone. */
:root {
  --page: #ffffff;
  --paper: #fbfbfa;
  --ink: #16181d;
  --ink2: #3d4350;
  --muted: #6b7280;
  --line: #e3e5e9;
  --line2: #cfd3da;
  --vlow: #a52a50;
  --low: #e2586e;
  --inr: #0d84c2;
  --high: #c98f12;
  --vhigh: #a35a10;
  --band: rgba(13, 132, 194, 0.08);
  --iqr: rgba(13, 132, 194, 0.32);
  --p90: rgba(13, 132, 194, 0.14);
  --accent: #0b7a5c;
  --f: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #eef0f3; color: var(--ink); font: 14px/1.5 var(--f); }
.toolbar { position: sticky; top: 0; z-index: 10; background: #16181d; color: #fff; }
.toolbar .in { max-width: 980px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar a.back { color: #9be7cf; text-decoration: none; font-weight: 600; margin-right: auto; }
.seg { display: inline-flex; border: 1px solid #3a3f4a; border-radius: 999px; overflow: hidden; }
.seg button { background: none; border: 0; color: #cdd2db; font: 600 13px var(--f); padding: 6px 12px; cursor: pointer; }
.seg button.on { background: #fff; color: #16181d; }
.tb-btn { background: #2ee59d; color: #03210f; border: 0; border-radius: 999px; font: 700 13px var(--f); padding: 7px 14px; cursor: pointer; }
.tb-check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: #cdd2db; cursor: pointer; }
.doc { max-width: 980px; margin: 18px auto 60px; padding: 0 16px; }
.page { background: var(--page); border: 1px solid var(--line); border-radius: 10px; padding: 28px 32px; margin-bottom: 18px; }
@media (max-width: 640px) { .page { padding: 18px 16px; } }
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink2); }
h3 { font-size: 13px; margin: 0 0 6px; color: var(--ink2); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); }
.hdr { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 12px; margin-bottom: 18px; }
.hdr dl { display: grid; grid-template-columns: auto auto; gap: 2px 14px; margin: 0; font-size: 13px; }
.hdr dt { color: var(--muted); }
.hdr dd { margin: 0; font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.stats { width: 100%; border-collapse: collapse; }
.stats td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
.stats td.v { text-align: right; font-weight: 700; font-family: var(--mono); white-space: nowrap; }
.stats td .goal { display: block; font-size: 11px; color: var(--muted); font-weight: 400; font-family: var(--f); }
.flag { font: 700 10px var(--f); padding: 1px 6px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
.flag.ok { background: #e3f4ec; color: #0b6b4d; }
.flag.no { background: #fbe9ec; color: #8f1f3e; }
.tir { display: grid; grid-template-columns: 54px 1fr; gap: 14px; align-items: stretch; }
.tirbar { display: flex; flex-direction: column-reverse; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--page); min-height: 240px; }
.tirlist { display: flex; flex-direction: column-reverse; justify-content: space-between; }
.tirrow { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding: 4px 0; font-size: 13px; }
.tirrow b { font-family: var(--mono); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font: 10px var(--f); fill: var(--muted); }
.agpwrap { position: relative; }
.tip { position: absolute; pointer-events: none; background: #16181d; color: #fff; font-size: 12px; padding: 6px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); display: none; z-index: 5; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink2); margin-top: 6px; }
.days { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 18px; }
@media (max-width: 760px) { .days { grid-template-columns: 1fr; } }
.day { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 4px; break-inside: avoid; }
.day .dh { display: flex; justify-content: space-between; font-size: 12px; }
.day .dh b { font-weight: 700; }
table.list { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.list th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1.5px solid var(--ink); padding: 6px 6px; }
table.list td { border-bottom: 1px solid var(--line); padding: 6px; vertical-align: top; }
table.list td.n { font-family: var(--mono); white-space: nowrap; }
table.list tr { break-inside: avoid; }
@media screen and (max-width: 760px) {
  table.list { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .hdr dl { grid-template-columns: auto 1fr; }
}
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: #f0f2f5; color: var(--ink2); white-space: nowrap; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.kpi .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.kpi .v { font: 700 20px var(--mono); }
.note-cell.hidden-notes { color: transparent; text-shadow: none; position: relative; }
body.hide-notes .note-text { display: none; }
body.hide-notes .note-hidden { display: inline; }
.note-hidden { display: none; color: var(--muted); font-style: italic; }
.empty { padding: 14px; text-align: center; color: var(--muted); border: 1px dashed var(--line2); border-radius: 8px; }
.foot { font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 18px; padding-top: 10px; }
.state { max-width: 560px; margin: 80px auto; background: #fff; border-radius: 12px; padding: 28px; text-align: center; border: 1px solid var(--line); }
details summary { cursor: pointer; font-size: 12px; color: var(--ink2); margin-top: 8px; }
.delta-up { color: #8a4b08; }
.delta-down { color: #0a5f8f; }
@media print {
  @page { size: letter; margin: 12mm; }
  body { background: #fff; font-size: 11px; }
  .toolbar, .no-print, details { display: none !important; }
  .doc { margin: 0; padding: 0; max-width: none; }
  .page { border: 0; border-radius: 0; padding: 0; margin: 0; break-after: page; }
  .page:last-child { break-after: auto; }
  .grid2 { grid-template-columns: 1.15fr 1fr; }
  .days { grid-template-columns: repeat(2, 1fr); }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <div class="in">
      <a class="back" href="portal.html">← Portal</a>
      <div class="seg" role="group" aria-label="Report period">
        <button type="button" data-days="7">7d</button>
        <button type="button" data-days="14" class="on">14d</button>
        <button type="button" data-days="30">30d</button>
        <button type="button" data-days="90">90d</button>
      </div>
      <label class="tb-check"><input type="checkbox" id="showNotes" checked /> Show notes</label>
      <button type="button" class="tb-btn" id="printBtn">Print / Save PDF</button>
    </div>
  </div>

  <main class="doc" id="doc">
    <div class="state" id="state">Loading your report…</div>
  </main>

  <script>
  (function () {
    'use strict';

    // ── Config / API (same rules as the other account pages) ──
    var isDev = location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    var API = window.AHEAD_API_BASE || 'https://api.aheadt1d.com';
    if (isDev) { try { API = localStorage.getItem('ahead_api_url') || 'http://localhost:3000'; } catch (_) {} }
    var token = null;
    try { token = localStorage.getItem('ahead_token'); } catch (_) {}
    var params = new URLSearchParams(location.search);
    var ownerParam = params.get('ownerId');
    var days = Math.min(90, Math.max(7, parseInt(params.get('days'), 10) || 14));

    var DAY = 86400000, MIN = 60000;
    var RANGES = [
      { key: 'vhigh', label: 'Very high', range: '>250', color: 'var(--vhigh)', test: function (v) { return v > 250; } },
      { key: 'high', label: 'High', range: '181–250', color: 'var(--high)', test: function (v) { return v > 180 && v <= 250; } },
      { key: 'inr', label: 'In range', range: '70–180', color: 'var(--inr)', test: function (v) { return v >= 70 && v <= 180; } },
      { key: 'low', label: 'Low', range: '54–69', color: 'var(--low)', test: function (v) { return v >= 54 && v < 70; } },
      { key: 'vlow', label: 'Very low', range: '<54', color: 'var(--vlow)', test: function (v) { return v < 54; } }
    ];
    var TAGS = {
      meal: ['🍽️', 'Meal / food'], insulin: ['💉', 'Insulin'], correction: ['💉', 'Correction'],
      exercise: ['🏃', 'Exercise'], site_change: ['🩹', 'Site change'], pod_issue: ['🔧', 'Pod issue'],
      illness: ['🤒', 'Illness'], stress: ['😰', 'Stress'], other: ['📝', 'Note']
    };
    function tagOf(t) { return TAGS[t] || ['📝', t]; }
    var Y_MIN = 40, Y_MAX = 350;

    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function round1(x) { return Math.round(x * 10) / 10; }
    function fmtDate(ms, opts) { return new Date(ms).toLocaleDateString([], opts || { month: 'short', day: 'numeric', year: 'numeric' }); }
    function fmtTime(ms) { return new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
    function fmtDur(min) { return min >= 60 ? Math.floor(min / 60) + 'h ' + (Math.round(min % 60) ? Math.round(min % 60) + 'm' : '') : Math.round(min) + 'm'; }
    function minuteOfDay(ms) { var d = new Date(ms); return d.getHours() * 60 + d.getMinutes(); }
    function startOfLocalDay(ms) { var d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); }

    function api(path) {
      return fetch(API + path, { headers: { Authorization: 'Bearer ' + token } }).then(function (r) {
        if (r.status === 401) throw Object.assign(new Error('signin'), { code: 401 });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
    }

    // ── Math (all pure; mirrors Ahead's AgpMetricsCalculator definitions) ──
    function percentile(sorted, q) {
      if (!sorted.length) return null;
      var pos = (sorted.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
      return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
    }

    function computeStats(t, v, from, to) {
      var n = v.length;
      if (!n) return null;
      var sum = 0; for (var i = 0; i < n; i++) sum += v[i];
      var mean = sum / n, ss = 0;
      for (i = 0; i < n; i++) ss += (v[i] - mean) * (v[i] - mean);
      var sd = Math.sqrt(ss / n);
      var counts = {}; RANGES.forEach(function (r) { counts[r.key] = 0; });
      for (i = 0; i < n; i++) for (var k = 0; k < RANGES.length; k++) if (RANGES[k].test(v[i])) { counts[RANGES[k].key]++; break; }
      var pct = {}; RANGES.forEach(function (r) { pct[r.key] = counts[r.key] * 100 / n; });
      // CGM active time: readings vs the G7's 5-minute cadence over the period.
      var expected = Math.max(1, (to - from) / (5 * MIN));
      return {
        n: n, mean: mean, sd: sd, cv: mean ? sd / mean * 100 : 0, gmi: 3.31 + 0.02392 * mean,
        pct: pct, active: Math.min(100, n / expected * 100),
        min: Math.min.apply(null, v), max: Math.max.apply(null, v)
      };
    }

    // AGP: 15-minute time-of-day bins across all days, percentiles smoothed
    // over a ±30-minute circular window (as consensus AGP reports do).
    function computeAgp(t, v) {
      var BINS = 96, bins = []; for (var b = 0; b < BINS; b++) bins.push([]);
      for (var i = 0; i < t.length; i++) bins[Math.floor(minuteOfDay(t[i]) / 15) % BINS].push(v[i]);
      var raw = bins.map(function (arr) {
        if (arr.length < 3) return null;
        var s = arr.slice().sort(function (a, c) { return a - c; });
        return { p5: percentile(s, 0.05), p25: percentile(s, 0.25), p50: percentile(s, 0.5), p75: percentile(s, 0.75), p95: percentile(s, 0.95), n: s.length };
      });
      return raw.map(function (pt, idx) {
        if (!pt) return null;
        var acc = { p5: 0, p25: 0, p50: 0, p75: 0, p95: 0 }, w = 0;
        for (var d = -2; d <= 2; d++) {
          var q = raw[(idx + d + BINS) % BINS];
          if (!q) continue;
          ['p5', 'p25', 'p50', 'p75', 'p95'].forEach(function (k) { acc[k] += q[k]; });
          w++;
        }
        ['p5', 'p25', 'p50', 'p75', 'p95'].forEach(function (k) { acc[k] /= w; });
        acc.n = pt.n;
        return acc;
      });
    }

    // Episodes: >= 15 min below 70 (level 2 if it reached < 54); ends after
    // 15 min back at/above 70, or at a data gap > 20 min.
    function episodes(t, v, test, minMinutes) {
      var out = [], cur = null, outSince = null;
      function close(endT) {
        if (cur && (endT - cur.start) / MIN >= minMinutes) { cur.end = endT; out.push(cur); }
        cur = null; outSince = null;
      }
      for (var i = 0; i < t.length; i++) {
        if (cur && i > 0 && t[i] - t[i - 1] > 20 * MIN) close(t[i - 1]);
        if (test(v[i])) {
          if (!cur) cur = { start: t[i], nadir: v[i], peak: v[i], lastIn: t[i] };
          cur.nadir = Math.min(cur.nadir, v[i]); cur.peak = Math.max(cur.peak, v[i]); cur.lastIn = t[i];
          outSince = null;
        } else if (cur) {
          if (outSince === null) outSince = t[i];
          if (t[i] - outSince >= 15 * MIN) close(cur.lastIn);
        }
      }
      if (cur) close(cur.lastIn);
      return out;
    }

    function nearest(t, v, at, maxGapMin) {
      var lo = 0, hi = t.length - 1;
      if (hi < 0) return null;
      while (lo < hi) { var mid = (lo + hi) >> 1; if (t[mid] < at) lo = mid + 1; else hi = mid; }
      var best = lo;
      if (lo > 0 && Math.abs(t[lo - 1] - at) < Math.abs(t[lo] - at)) best = lo - 1;
      return Math.abs(t[best] - at) <= maxGapMin * MIN ? v[best] : null;
    }
    function windowMinMax(t, v, from, to) {
      var mn = null, mx = null;
      for (var i = 0; i < t.length; i++) {
        if (t[i] <= from) continue;
        if (t[i] > to) break;
        mn = mn === null ? v[i] : Math.min(mn, v[i]); mx = mx === null ? v[i] : Math.max(mx, v[i]);
      }
      return { min: mn, max: mx };
    }

    // ── SVG helpers ──
    function y(vv, top, h) { var c = Math.max(Y_MIN, Math.min(Y_MAX, vv)); return top + h - (c - Y_MIN) / (Y_MAX - Y_MIN) * h; }
    function pathFrom(points) { return points.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(''); }

    function agpSvg(agp) {
      var W = 900, H = 300, L = 38, R = 10, T = 10, B = 24, w = W - L - R, h = H - T - B;
      var x = function (bin) { return L + (bin + 0.5) / 96 * w; };
      var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Ambulatory glucose profile: median and percentile bands by time of day">';
      s += '<rect x="' + L + '" y="' + y(180, T, h) + '" width="' + w + '" height="' + (y(70, T, h) - y(180, T, h)) + '" fill="var(--band)"/>';
      [54, 70, 180, 250].forEach(function (g) {
        var dash = g === 70 || g === 180 ? '' : ' stroke-dasharray="3 4"';
        s += '<line x1="' + L + '" x2="' + (L + w) + '" y1="' + y(g, T, h) + '" y2="' + y(g, T, h) + '" stroke="' + (g < 70 ? 'var(--low)' : g > 180 ? 'var(--high)' : 'var(--inr)') + '" stroke-width="1"' + dash + ' opacity=".7"/>';
        s += '<text x="' + (L - 6) + '" y="' + (y(g, T, h) + 3) + '" text-anchor="end">' + g + '</text>';
      });
      for (var hr = 0; hr <= 24; hr += 3) {
        var xx = L + hr / 24 * w;
        s += '<line x1="' + xx + '" x2="' + xx + '" y1="' + T + '" y2="' + (T + h) + '" stroke="var(--line)"/>';
        s += '<text x="' + xx + '" y="' + (H - 6) + '" text-anchor="middle">' + ['12a', '3a', '6a', '9a', '12p', '3p', '6p', '9p', '12a'][hr / 3] + '</text>';
      }
      // Bands drawn per contiguous run of bins that have data.
      var runs = [], run = [];
      agp.forEach(function (p, i) { if (p) run.push(i); else if (run.length) { runs.push(run); run = []; } });
      if (run.length) runs.push(run);
      runs.forEach(function (r) {
        function band(lo, hi, fill) {
          var top = r.map(function (i) { return [x(i), y(agp[i][hi], T, h)]; });
          var bot = r.slice().reverse().map(function (i) { return [x(i), y(agp[i][lo], T, h)]; });
          s += '<path d="' + pathFrom(top.concat(bot)) + 'Z" fill="' + fill + '"/>';
        }
        band('p5', 'p95', 'var(--p90)');
        band('p25', 'p75', 'var(--iqr)');
        s += '<path d="' + pathFrom(r.map(function (i) { return [x(i), y(agp[i].p50, T, h)]; })) + '" fill="none" stroke="#0a3d62" stroke-width="2" stroke-linejoin="round"/>';
        s += '<path d="' + pathFrom(r.map(function (i) { return [x(i), y(agp[i].p5, T, h)]; })) + '" fill="none" stroke="#0d84c2" stroke-width="1" stroke-dasharray="4 3" opacity=".8"/>';
        s += '<path d="' + pathFrom(r.map(function (i) { return [x(i), y(agp[i].p95, T, h)]; })) + '" fill="none" stroke="#0d84c2" stroke-width="1" stroke-dasharray="4 3" opacity=".8"/>';
      });
      s += '<line id="agpCross" x1="0" x2="0" y1="' + T + '" y2="' + (T + h) + '" stroke="var(--ink)" stroke-width="1" opacity="0"/>';
      s += '<rect id="agpHit" x="' + L + '" y="' + T + '" width="' + w + '" height="' + h + '" fill="transparent"/>';
      return s + '</svg>';
    }

    function daySvg(t, v, dayStart, events) {
      var W = 440, H = 120, L = 4, R = 4, T = 14, B = 12, w = W - L - R, h = H - T - B;
      var x = function (ms) { return L + (ms - dayStart) / DAY * w; };
      var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
      s += '<rect x="' + L + '" y="' + y(180, T, h) + '" width="' + w + '" height="' + (y(70, T, h) - y(180, T, h)) + '" fill="var(--band)"/>';
      [70, 180].forEach(function (g) { s += '<line x1="' + L + '" x2="' + (L + w) + '" y1="' + y(g, T, h) + '" y2="' + y(g, T, h) + '" stroke="var(--inr)" stroke-width=".7" opacity=".5"/>'; });
      [6, 12, 18].forEach(function (hr) {
        var xx = L + hr / 24 * w;
        s += '<line x1="' + xx + '" x2="' + xx + '" y1="' + T + '" y2="' + (T + h) + '" stroke="var(--line)"/>';
        s += '<text x="' + xx + '" y="' + (H - 1) + '" text-anchor="middle" style="font-size:8px">' + ['6a', '12p', '6p'][hr / 6 - 1] + '</text>';
      });
      var seg = [], prev = null;
      function flush() { if (seg.length > 1) s += '<path d="' + pathFrom(seg) + '" fill="none" stroke="#1d2433" stroke-width="1.3" stroke-linejoin="round"/>'; seg = []; }
      for (var i = 0; i < t.length; i++) {
        if (t[i] < dayStart || t[i] >= dayStart + DAY) continue;
        if (prev !== null && t[i] - prev > 15 * MIN) flush();
        seg.push([x(t[i]), y(v[i], T, h)]); prev = t[i];
        if (v[i] < 70) s += '<circle cx="' + x(t[i]).toFixed(1) + '" cy="' + y(v[i], T, h).toFixed(1) + '" r="1.6" fill="' + (v[i] < 54 ? 'var(--vlow)' : 'var(--low)') + '"/>';
      }
      flush();
      events.forEach(function (e) {
        if (e.time < dayStart || e.time >= dayStart + DAY) return;
        var tg = tagOf(e.tag);
        s += '<g><title>' + esc(fmtTime(e.time) + ' · ' + tg[1] + (e.note ? ' — ' + e.note : '')) + '</title>' +
          '<line x1="' + x(e.time) + '" x2="' + x(e.time) + '" y1="' + T + '" y2="' + (T + h) + '" stroke="#7a5af8" stroke-width=".8" stroke-dasharray="2 2"/>' +
          '<text x="' + x(e.time) + '" y="' + (T - 3) + '" text-anchor="middle" style="font-size:10px">' + tg[0] + '</text></g>';
      });
      return s + '</svg>';
    }

    // ── Render ──
    var state = { profile: null, readings: null, events: [], own: true, ownerLabel: '' };

    function render() {
      var to = Date.now(), from = to - days * DAY;
      var t = [], v = [];
      state.readings.t.forEach(function (ms, i) { if (ms >= from && ms <= to) { t.push(ms); v.push(state.readings.v[i]); } });
      var events = state.events.filter(function (e) { return e.time >= from && e.time <= to; })
        .sort(function (a, b) { return a.time - b.time; });
      var st = computeStats(t, v, from, to);
      var p = state.profile || {};
      var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').replace(/_/g, ' ');

      var header = '<div class="hdr"><div><h1>Continuous Glucose Monitoring Report</h1>' +
        '<div class="muted">' + esc(fmtDate(from)) + ' – ' + esc(fmtDate(to)) + ' · ' + days + ' days · times in ' + esc(tz) + '</div></div>' +
        '<dl><dt>Patient</dt><dd>' + esc(state.ownerLabel) + '</dd>' +
        (p.dob ? '<dt>Date of birth</dt><dd>' + esc(String(p.dob).slice(0, 10)) + '</dd>' : '') +
        (p.diagnosisDate ? '<dt>T1D diagnosed</dt><dd>' + esc(String(p.diagnosisDate).slice(0, 10)) + '</dd>' : '') +
        '<dt>Source</dt><dd>CGM via Ahead (Health Connect)</dd>' +
        '<dt>Generated</dt><dd>' + esc(new Date().toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })) + '</dd></dl></div>';

      if (!st) {
        $('doc').innerHTML = '<section class="page">' + header + '<div class="empty">No glucose readings in this period. Make sure Ahead is signed in and syncing.</div></section>';
        return;
      }

      function goal(ok) { return '<span class="flag ' + (ok ? 'ok' : 'no') + '">' + (ok ? 'meets goal' : 'above goal') + '</span>'; }
      var lowAll = st.pct.low + st.pct.vlow, highAll = st.pct.high + st.pct.vhigh;
      var statsTable = '<table class="stats">' +
        '<tr><td>Time CGM active<span class="goal">Goal ≥ 70% of the period</span></td><td class="v">' + round1(st.active) + '%</td></tr>' +
        '<tr><td>Readings</td><td class="v">' + st.n.toLocaleString() + '</td></tr>' +
        '<tr><td>Mean glucose</td><td class="v">' + Math.round(st.mean) + ' mg/dL</td></tr>' +
        '<tr><td>Glucose Management Indicator (GMI)<span class="goal">Estimated A1C from CGM mean</span></td><td class="v">' + round1(st.gmi) + '%</td></tr>' +
        '<tr><td>Glucose variability (CV)<span class="goal">Goal ≤ 36%</span></td><td class="v">' + round1(st.cv) + '%' + goal(st.cv <= 36) + '</td></tr>' +
        '<tr><td>Standard deviation</td><td class="v">' + Math.round(st.sd) + ' mg/dL</td></tr>' +
        '<tr><td>Range seen</td><td class="v">' + st.min + '–' + st.max + ' mg/dL</td></tr></table>' +
        (st.active < 70 ? '<p class="small" style="color:#8f1f3e;margin-top:8px">Less than 70% CGM coverage: treat these numbers with caution.</p>' : '') +
        (days < 14 ? '<p class="small muted" style="margin-top:8px">Consensus guidance recommends 14 days of data for a representative picture.</p>' : '');

      var goals = { vhigh: ['< 5%', st.pct.vhigh < 5], high: ['< 25% (with very high)', highAll < 25], inr: ['> 70%', st.pct.inr > 70], low: ['< 4% (with very low)', lowAll < 4], vlow: ['< 1%', st.pct.vlow < 1] };
      var bar = '<div class="tirbar" aria-hidden="true">' + RANGES.slice().reverse().filter(function (r) { return st.pct[r.key] > 0; }).map(function (r) {
        return '<div style="min-height:3px;flex:' + st.pct[r.key] + ' 0 0;background:' + r.color + '" title="' + r.label + ' ' + round1(st.pct[r.key]) + '%"></div>';
      }).join('') + '</div>';
      var list = '<div class="tirlist">' + RANGES.slice().reverse().map(function (r) {
        var mins = st.pct[r.key] / 100 * 1440;
        return '<div class="tirrow"><span><span class="sw" style="background:' + r.color + '"></span>' + r.label + ' <span class="muted small">' + r.range + '</span><br><span class="small muted">Goal ' + goals[r.key][0] + goal(goals[r.key][1]).replace('above goal', r.key === 'inr' ? 'below goal' : 'above goal') + '</span></span>' +
          '<span style="text-align:right"><b>' + round1(st.pct[r.key]) + '%</b><br><span class="small muted">' + fmtDur(mins) + '/day</span></span></div>';
      }).join('') + '</div>';

      var agp = computeAgp(t, v);
      var agpTable = '<details><summary>Show AGP as a table (hourly percentiles)</summary><table class="list" style="margin-top:6px"><tr><th>Hour</th><th>5%</th><th>25%</th><th>Median</th><th>75%</th><th>95%</th></tr>' +
        agp.filter(function (_, i) { return i % 4 === 0; }).map(function (a, hr) {
          return '<tr><td>' + hr + ':00</td>' + (a ? ['p5', 'p25', 'p50', 'p75', 'p95'].map(function (k) { return '<td class="n">' + Math.round(a[k]) + '</td>'; }).join('') : '<td colspan="5" class="muted">not enough data</td>') + '</tr>';
        }).join('') + '</table></details>';

      var page1 = '<section class="page">' + header +
        '<div class="grid2"><div><h2>Glucose statistics</h2>' + statsTable + '</div>' +
        '<div><h2>Time in ranges</h2><div class="tir">' + bar + list + '</div></div></div>' +
        '<div style="margin-top:22px"><h2>Ambulatory glucose profile (AGP)</h2>' +
        '<p class="small muted" style="margin:-4px 0 8px">All days overlaid by time of day. Line = median; dark band = 25–75th percentile; light band and dashed lines = 5–95th. Shaded strip = target 70–180 mg/dL.</p>' +
        '<div class="agpwrap" id="agpWrap">' + agpSvg(agp) + '<div class="tip" id="agpTip"></div></div>' + agpTable + '</div>' +
        footer() + '</section>';

      // Patterns: time-of-day blocks + episodes
      var blocks = [['Overnight', 0, 6], ['Morning', 6, 12], ['Afternoon', 12, 18], ['Evening', 18, 24]].map(function (b) {
        var bv = []; for (var i = 0; i < t.length; i++) { var hr = new Date(t[i]).getHours(); if (hr >= b[1] && hr < b[2]) bv.push(v[i]); }
        var bs = computeStats([0], bv.length ? bv : [], 0, 1);
        return { name: b[0], hours: b[1] + ':00–' + b[2] + ':00', s: bv.length ? bs : null };
      });
      var lows = episodes(t, v, function (x) { return x < 70; }, 15);
      var highs = episodes(t, v, function (x) { return x > 250; }, 120);
      lows.forEach(function (ep) {
        ep.level2 = ep.nadir < 54;
        var hr = new Date(ep.start).getHours();
        ep.overnight = hr < 6;
        ep.treated = events.some(function (e) { return (e.tag === 'correction' || e.tag === 'meal') && e.time >= ep.start - 15 * MIN && e.time <= ep.end + 30 * MIN; });
      });
      var daysCount = Math.max(1, days);

      var kpis = '<div class="kpis">' +
        '<div class="kpi"><div class="k">Low episodes</div><div class="v">' + lows.length + '</div><div class="small muted">' + round1(lows.length / daysCount * 7) + ' per week</div></div>' +
        '<div class="kpi"><div class="k">Very low (&lt;54)</div><div class="v">' + lows.filter(function (e) { return e.level2; }).length + '</div><div class="small muted">episodes</div></div>' +
        '<div class="kpi"><div class="k">Overnight lows</div><div class="v">' + lows.filter(function (e) { return e.overnight; }).length + '</div><div class="small muted">started 12–6 AM</div></div>' +
        '<div class="kpi"><div class="k">Highs &gt;250 for 2h+</div><div class="v">' + highs.length + '</div><div class="small muted">episodes</div></div></div>';

      var blockTable = '<table class="list"><tr><th>Time of day</th><th>In range</th><th>Below 70</th><th>Above 180</th><th>Mean</th><th>CV</th></tr>' +
        blocks.map(function (b) {
          if (!b.s) return '<tr><td>' + b.name + ' <span class="muted small">' + b.hours + '</span></td><td colspan="5" class="muted">no data</td></tr>';
          return '<tr><td>' + b.name + ' <span class="muted small">' + b.hours + '</span></td><td class="n">' + round1(b.s.pct.inr) + '%</td><td class="n">' + round1(b.s.pct.low + b.s.pct.vlow) + '%</td><td class="n">' + round1(b.s.pct.high + b.s.pct.vhigh) + '%</td><td class="n">' + Math.round(b.s.mean) + '</td><td class="n">' + round1(b.s.cv) + '%</td></tr>';
        }).join('') + '</table>';

      var lowTable = lows.length ? '<table class="list"><tr><th>Started</th><th>Duration</th><th>Lowest</th><th>Level</th><th>Treatment logged?</th></tr>' +
        lows.slice().reverse().map(function (ep) {
          return '<tr><td class="n">' + esc(fmtDate(ep.start, { weekday: 'short', month: 'short', day: 'numeric' }) + ' ' + fmtTime(ep.start)) + (ep.overnight ? ' <span class="pill">overnight</span>' : '') + '</td>' +
            '<td class="n">' + fmtDur((ep.end - ep.start) / MIN + 5) + '</td><td class="n">' + ep.nadir + ' mg/dL</td>' +
            '<td>' + (ep.level2 ? '<span class="sw" style="background:var(--vlow)"></span>Level 2 (&lt;54)' : '<span class="sw" style="background:var(--low)"></span>Level 1 (54–69)') + '</td>' +
            '<td>' + (ep.treated ? 'Yes' : '<span class="muted">none logged</span>') + '</td></tr>';
        }).join('') + '</table>' : '<div class="empty">No low episodes (15+ minutes below 70 mg/dL) in this period.</div>';

      var page2 = '<section class="page"><h2>Patterns &amp; episodes</h2>' + kpis +
        '<h3>By time of day</h3>' + blockTable +
        '<h3 style="margin-top:18px">Low episodes <span class="muted small">(15+ min below 70 mg/dL)</span></h3>' + lowTable + footer() + '</section>';

      // Events with "what happened next"
      var evRows = events.slice().reverse().map(function (e) {
        var tg = tagOf(e.tag);
        var at = e.glucoseAtTime != null ? Math.round(e.glucoseAtTime) : nearest(t, v, e.time, 10);
        var g1 = nearest(t, v, e.time + 60 * MIN, 10), g2 = nearest(t, v, e.time + 120 * MIN, 10);
        var mm = windowMinMax(t, v, e.time, e.time + 180 * MIN);
        function delta(g) {
          if (g == null) return '<span class="muted">—</span>';
          if (at == null) return g;
          var d = g - at;
          return g + ' <span class="small ' + (d > 0 ? 'delta-up' : 'delta-down') + '">(' + (d > 0 ? '+' : '') + d + ')</span>';
        }
        return '<tr><td class="n">' + esc(fmtDate(e.time, { weekday: 'short', month: 'short', day: 'numeric' })) + '<br>' + esc(fmtTime(e.time)) + '</td>' +
          '<td style="white-space:nowrap">' + tg[0] + ' ' + esc(tg[1]) + '</td>' +
          '<td><span class="note-text">' + esc(e.note || '') + '</span><span class="note-hidden">' + (e.note ? 'hidden' : '') + '</span></td>' +
          '<td class="n">' + (at != null ? at : '<span class="muted">—</span>') + '</td>' +
          '<td class="n">' + delta(g1) + '</td><td class="n">' + delta(g2) + '</td>' +
          '<td class="n">' + (mm.min != null ? mm.min + '–' + mm.max : '<span class="muted">—</span>') + '</td></tr>';
      }).join('');
      var counts = {};
      events.forEach(function (e) { counts[e.tag] = (counts[e.tag] || 0) + 1; });
      var countPills = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).map(function (k) {
        return '<span class="pill">' + tagOf(k)[0] + ' ' + esc(tagOf(k)[1]) + ': ' + counts[k] + '</span>';
      }).join(' ');
      var evSection = !state.own
        ? '<div class="empty">Logged events and notes are private to the account owner and are not included in a shared report.</div>'
        : events.length
          ? '<p class="small muted" style="margin:-4px 0 8px">Every event logged in Ahead or the web portal, with the glucose that followed. Changes are from the reading at the time of the event.</p>' +
            '<div style="margin-bottom:10px">' + countPills + '</div>' +
            '<table class="list"><tr><th>When</th><th>Event</th><th>Note</th><th>At event</th><th>+1 h</th><th>+2 h</th><th>3 h range</th></tr>' + evRows + '</table>'
          : '<div class="empty">No events logged in this period. Meals, insulin, corrections, exercise and notes logged in Ahead appear here automatically.</div>';
      var page3 = '<section class="page"><h2>Logged events &amp; response</h2>' + evSection + footer() + '</section>';

      // Daily profiles: last 14 days at most, newest first.
      var dayStarts = [];
      var lastDay = startOfLocalDay(to);
      for (var d = 0; d < Math.min(days, 14); d++) { var ds = new Date(lastDay); ds.setDate(ds.getDate() - d); dayStarts.push(ds.getTime()); }
      var dayCards = dayStarts.map(function (ds) {
        var dv = []; for (var i = 0; i < t.length; i++) if (t[i] >= ds && t[i] < ds + DAY) dv.push(v[i]);
        var dsS = dv.length ? computeStats([0], dv, 0, 1) : null;
        return '<div class="day"><div class="dh"><b>' + esc(fmtDate(ds, { weekday: 'short', month: 'short', day: 'numeric' })) + '</b>' +
          '<span class="muted">' + (dsS ? 'In range ' + Math.round(dsS.pct.inr) + '% · mean ' + Math.round(dsS.mean) + (dv.some(function (x) { return x < 70; }) ? ' · lows' : '') : 'no data') + '</span></div>' +
          daySvg(t, v, ds, state.own ? events : []) + '</div>';
      }).join('');
      var page4 = '<section class="page"><h2>Daily glucose profiles</h2><p class="small muted" style="margin:-4px 0 10px">' +
        (days > 14 ? 'Most recent 14 days shown. ' : '') + 'Shaded band = 70–180 mg/dL; red dots = readings below 70; dashed purple lines = logged events (hover for details).</p>' +
        '<div class="days">' + dayCards + '</div>' + footer() + '</section>';

      $('doc').innerHTML = page1 + page2 + page3 + page4;
      wireAgpHover(agp);
    }

    function footer() {
      return '<div class="foot">Generated by Ahead (aheadt1d.com) from CGM data synced by the patient\'s phone. Ahead is beta software and not a medical device; values may contain gaps or sensor error. Metrics follow the International Consensus on Time in Range (2019) definitions. Not a substitute for clinical judgment.</div>';
    }

    function wireAgpHover(agp) {
      var hit = $('agpHit'), tip = $('agpTip'), cross = $('agpCross'), wrap = $('agpWrap');
      if (!hit) return;
      function show(ev) {
        var svg = hit.ownerSVGElement, rect = svg.getBoundingClientRect();
        var pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
        var loc = pt.matrixTransform(svg.getScreenCTM().inverse());
        var L = 38, w = 900 - 38 - 10;
        var bin = Math.max(0, Math.min(95, Math.floor((loc.x - L) / w * 96)));
        var a = agp[bin];
        var xx = L + (bin + 0.5) / 96 * w;
        cross.setAttribute('x1', xx); cross.setAttribute('x2', xx); cross.setAttribute('opacity', '.35');
        var hh = Math.floor(bin / 4), mm = (bin % 4) * 15;
        var label = (hh % 12 || 12) + ':' + (mm < 10 ? '0' : '') + mm + (hh < 12 ? ' AM' : ' PM');
        tip.innerHTML = '<b>' + label + '</b><br>' + (a ? 'Median ' + Math.round(a.p50) + ' · 25–75%: ' + Math.round(a.p25) + '–' + Math.round(a.p75) + '<br>5–95%: ' + Math.round(a.p5) + '–' + Math.round(a.p95) + ' mg/dL' : 'Not enough data');
        tip.style.display = 'block';
        tip.style.left = ((xx / 900) * rect.width) + 'px';
        tip.style.top = (ev.clientY - wrap.getBoundingClientRect().top) + 'px';
      }
      hit.addEventListener('mousemove', show);
      hit.addEventListener('touchstart', function (e) { show(e.touches[0]); }, { passive: true });
      hit.addEventListener('mouseleave', function () { tip.style.display = 'none'; cross.setAttribute('opacity', '0'); });
    }

    function fail(html) { $('doc').innerHTML = '<div class="state">' + html + '</div>'; }

    function load() {
      if (!token) { fail('Please <a href="login.html">sign in</a> to view your report.'); return; }
      var to = Date.now(), from = to - 90 * DAY;
      api('/api/auth/me').then(function (me) {
        var user = me.user || me;
        var owner = ownerParam || user.id;
        state.own = owner === user.id;
        state.profile = state.own ? user : null;
        state.ownerLabel = state.own ? (user.displayName || user.email) : '';
        var q = '/api/readings/range?from=' + from + '&to=' + to + (state.own ? '' : '&ownerId=' + encodeURIComponent(owner));
        var jobs = [api(q)];
        jobs.push(state.own ? api('/api/events?from=' + from + '&to=' + to).catch(function () { return { events: [] }; }) : Promise.resolve({ events: [] }));
        if (!state.own) jobs.push(api('/api/shares/accessible').catch(function () { return []; }));
        return Promise.all(jobs).then(function (res) {
          state.readings = res[0];
          state.events = (res[1].events || []);
          if (!state.own) {
            var list = Array.isArray(res[2]) ? res[2] : (res[2] && res[2].streams) || [];
            var hit = list.filter(function (s) { return s.ownerId === owner; })[0];
            state.ownerLabel = hit ? hit.ownerEmail : 'Shared stream';
          }
          render();
        });
      }).catch(function (e) {
        if (e && e.code === 401) fail('Your session has expired. Please <a href="login.html">sign in again</a>.');
        else fail('Couldn\'t load the report. The Ahead server may be offline, or it may need a restart to pick up the report feature.<br><span class="small muted">' + esc(e && e.message) + '</span>');
      });
    }

    // ── Controls ──
    document.querySelectorAll('.seg button').forEach(function (b) {
      b.classList.toggle('on', +b.getAttribute('data-days') === days);
      b.addEventListener('click', function () {
        days = +b.getAttribute('data-days');
        document.querySelectorAll('.seg button').forEach(function (x) { x.classList.toggle('on', x === b); });
        var u = new URL(location.href); u.searchParams.set('days', days); history.replaceState(null, '', u);
        if (state.readings) render();
      });
    });
    $('showNotes').addEventListener('change', function () { document.body.classList.toggle('hide-notes', !this.checked); });
    $('printBtn').addEventListener('click', function () { window.print(); });

    load();
  })();
  </script>
</body>
</html>
